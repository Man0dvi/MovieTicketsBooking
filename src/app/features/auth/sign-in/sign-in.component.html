<!-- src/app/features/auth/sign-in/sign-in.component.html -->
<div class="auth-container">
  <div class="overlay">
    <div class="brand-block">
      <h1 class="brand">Cinemania<br/>Delight</h1>
    </div>
    <div class="card-wrap">
      <div class="auth-card">
        <h2 class="title">SIGN IN</h2>
        <!-- Notice: use #f="ngForm" and [(ngModel)] -->
        <form #f="ngForm" (ngSubmit)="onSubmit(f)" class="form">
          <label class="field">
            <span class="label-text">Enter Phone Number</span>
            <input 
              type="tel" 
              name="phone" 
              class="input" 
              appAutofocus
              [(ngModel)]="phone"
              required
              #phoneCtrl="ngModel"
              [class.invalid]="phoneCtrl.invalid && (phoneCtrl.touched || phoneCtrl.dirty)"
            />
          </label>
          <div class="err" *ngIf="phoneCtrl.invalid && (phoneCtrl.touched || phoneCtrl.dirty)">Phone is required</div>

          <label class="field">
            <span class="label-text">Password</span>
            <div class="pw-row">
              <input 
                [type]="showPw ? 'text' : 'password'" 
                name="password" 
                class="input" 
                [(ngModel)]="password"
                required
                #pwCtrl="ngModel"
                [class.invalid]="pwCtrl.invalid && (pwCtrl.touched || pwCtrl.dirty)"
              />
              <button type="button" class="eye" (click)="showPw = !showPw" [attr.aria-pressed]="showPw">{{ showPw ? 'Hide' : 'Show' }}</button>
            </div>
          </label>
          <div class="err" *ngIf="pwCtrl.invalid && (pwCtrl.touched || pwCtrl.dirty)">Password is required</div>

          <button type="submit" class="signin-btn" [disabled]="f.invalid">SIGN IN</button>
          <div class="actions">
            <a routerLink="/signup" class="link">New user? Sign Up</a>
          </div>
        </form>
        <div class="note err" *ngIf="error">{{ error }}</div>
      </div>
    </div>
  </div>
</div>
