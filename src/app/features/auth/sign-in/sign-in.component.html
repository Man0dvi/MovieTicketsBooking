<!-- src/app/features/auth/sign-in/sign-in.component.html -->
<div class="auth-container">
  <div class="overlay">
    <div class="brand-block">
      <h1 class="brand">Cinemania<br/>Delight</h1>
    </div>

    <div class="card-wrap">
      <div class="auth-card">
        <h2 class="title">SIGN IN</h2>

        <form [formGroup]="form" (ngSubmit)="onSubmit()" class="form">
          <label class="field">
            <span class="label-text">Enter Phone Number</span>
            <input type="tel" formControlName="phone" class="input" />
          </label>
          <div class="err" *ngIf="f['phone'].touched && f['phone'].invalid">Phone is required</div>

          <label class="field">
            <span class="label-text">Password</span>
            <div class="pw-row">
              <input [type]="showPw ? 'text' : 'password'" formControlName="password" class="input" />
              <button type="button" class="eye" (click)="showPw = !showPw" [attr.aria-pressed]="showPw">{{ showPw ? 'Hide' : 'Show' }}</button>
            </div>
          </label>
          <div class="err" *ngIf="f['password'].touched && f['password'].invalid">Password is required</div>

          <button type="submit" class="signin-btn" [disabled]="form.invalid">SIGN IN</button>

          <div class="actions">
            <a routerLink="/signup" class="link">New user? Sign Up</a>
          </div>
        </form>

        <div class="note err" *ngIf="error">{{ error }}</div>
      </div>
    </div>
  </div>
</div>
