<!-- src/app/features/movies/movie-card/movie-card.component.html -->
<!-- the root is clickable and keyboard-accessible (role + tabindex) -->
<article
  class="movie-card"
  role="button"
  tabindex="0"
  (click)="onActivate()"
  (keydown)="onKeydown($event)"
  [attr.aria-label]="movie?.title"
>
  <div class="poster-wrap">
    <img [src]="posterUrl" [alt]="movie.title" />
  </div>

  <div class="info">
    <h3 class="title">{{ movie.title }}</h3>

    <p class="meta">
      {{ movie.duration || '' }}
      <span *ngIf="movie.duration && movie.rating">•</span>
      {{ movie.rating || '' }}
    </p>

    <!-- optional injected actions -->
    <ng-content select="[card-actions]"></ng-content>
  </div>
</article>
